version: '3.8'

services:
  mantior:
    build:
      context: .
      dockerfile: Dockerfile
    image: mantior/mantior:latest
    container_name: mantior
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./mantior.yaml:/app/mantior.yaml:ro
      - ./specs:/app/specs:ro
      - ./.env:/app/.env:ro
      - mantior-data:/app/.mantior
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    env_file:
      - .env
    command: ["server", "--port", "8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mantior-cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: mantior/mantior:latest
    container_name: mantior-cli
    restart: "no"
    volumes:
      - ./mantior.yaml:/app/mantior.yaml:ro
      - ./specs:/app/specs:ro
      - ./.env:/app/.env:ro
      - mantior-data:/app/.mantior
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    entrypoint: ["node", "dist/index.js"]
    command: ["--help"]

volumes:
  mantior-data:
    name: mantior-data
