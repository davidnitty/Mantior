version: '3.8'

# Production image is built and published to GHCR by
# .github/workflows/docker-publish.yml as:
#   ghcr.io/<owner>/mantior/mantior:latest
# For a private repo the host must authenticate first:
#   docker login ghcr.io -u <user> --password-stdin <<< <PAT with read:packages>
# then `docker compose pull && docker compose up -d`.

services:
  mantior:
    image: ghcr.io/davidnitty/mantior/mantior:latest
    container_name: mantior
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./mantior.yaml:/app/mantior.yaml:ro
      - ./specs:/app/specs:ro
      - ./.env:/app/.env:ro
      - mantior-data:/app/.mantior
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    env_file:
      - .env
    command: ["server", "--port", "8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mantior-cli:
    image: ghcr.io/davidnitty/mantior/mantior:latest
    container_name: mantior-cli
    restart: "no"
    volumes:
      - ./mantior.yaml:/app/mantior.yaml:ro
      - ./specs:/app/specs:ro
      - ./.env:/app/.env:ro
      - mantior-data:/app/.mantior
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    entrypoint: ["node", "dist/index.js"]
    command: ["--help"]

volumes:
  mantior-data:
    name: mantior-data
