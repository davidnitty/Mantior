name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint:ci

      - name: Format Check
        run: npm run format:check

      - name: Unit Tests
        run: npm run test:unit -- --coverage

      # Uploading to a private repo requires a CODECOV_TOKEN. The upload is a
      # best-effort bonus: skip it entirely when no token is configured (avoids
      # codecov-action retry hangs stalling the whole job) and never let a
      # failed upload fail CI.
      - name: Upload Coverage
        if: env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          token: ${{ env.CODECOV_TOKEN }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality-checks
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Integration Tests
        env:
          GITHUB_TOKEN: ${{ secrets.MANTIOR_TEST_TOKEN }}
        run: npm run test:integration

      # E2E tests are skipped in CI (manual only)
