name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint:ci

      - name: Format Check
        run: npm run format:check

      - name: Unit Tests
        run: npm run test:unit -- --coverage

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          # Uploading to a private repo requires a CODECOV_TOKEN; until one is
          # configured, don't let the upload fail the pipeline.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Integration Tests
        env:
          GITHUB_TOKEN: ${{ secrets.MANTIOR_TEST_TOKEN }}
        run: npm run test:integration

      # E2E tests are skipped in CI (manual only)
